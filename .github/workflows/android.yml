name: App Android

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar APK
        working-directory: android
        env:
          # Repository variable with the server address, e.g. https://control-llamados.up.railway.app
          SERVER_URL: ${{ vars.SERVER_URL }}
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew assembleRelease --no-daemon
      - name: Renombrar APK
        run: cp android/app/build/outputs/apk/release/app-release.apk control-llamados.apk
      - uses: actions/upload-artifact@v4
        with:
          name: control-llamados-apk
          path: control-llamados.apk
      - name: Publicar en Releases
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest control-llamados.apk \
            --title "App Android (build ${{ github.run_number }})" \
            --notes "Instalar en el telefono de cada ejecutivo. Se instala encima de la version anterior sin perder la vinculacion." \
            --latest
