name: Diagnostico

# Manual run: shows, per phone, how long today's calls took to reach the server.
# Prints only aggregates (no phone numbers or names) because the logs are public.

on:
  workflow_dispatch:

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Consultar
        working-directory: worker
        run: |
          corepack enable
          pnpm install --frozen-lockfile > /dev/null
          ACCOUNT_ID=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/accounts | jq -r '.result[0].id')
          export CLOUDFLARE_ACCOUNT_ID="$ACCOUNT_ID"
          SINCE=$(( ($(TZ=America/Santiago date -d 'today 00:00' +%s)) * 1000 ))
          ID=$(npx wrangler d1 list --json | jq -r '.[] | select(.name == "llamados") | .uuid')
          sed -i "s/00000000-0000-0000-0000-000000000000/$ID/" wrangler.jsonc
          q() {
            out=$(npx wrangler d1 execute llamados --remote --json --command "$1")
            echo "$out" | jq -r '(if type == "array" then .[0] else . end) | .results[] | [.[]] | @tsv' || echo "$out" | head -c 2000
          }
          echo "== Telefonos: id, modelo, ultimo envio (Santiago)"
          q "SELECT id, device_model, datetime(last_sync_at/1000, 'unixepoch', '-3 hours') FROM executives WHERE device_token_hash IS NOT NULL"
          echo "== Hoy por telefono: id, llamadas, con espera medida, atraso promedio s, atraso max s, llamadas con atraso > 2 min"
          LAG="((c.received_at - c.started_at)/1000 - c.duration_sec - COALESCE(c.ring_sec, 0))"
          q "SELECT c.executive_id, COUNT(*), SUM(c.ring_sec IS NOT NULL), CAST(AVG($LAG) AS INT), MAX($LAG), SUM($LAG > 120) FROM calls c WHERE c.started_at >= $SINCE GROUP BY c.executive_id"
          echo "== Hoy por telefono y hora de la llamada: id, hora, llamadas, atraso max s, hora de llegada max"
          q "SELECT c.executive_id, strftime('%H', c.started_at/1000, 'unixepoch', '-3 hours'), COUNT(*), MAX($LAG), strftime('%H:%M', MAX(c.received_at)/1000, 'unixepoch', '-3 hours') FROM calls c WHERE c.started_at >= $SINCE GROUP BY 1, 2 ORDER BY 1, 2"
          echo "== Ultimos 7 dias por telefono y dia: id, dia, llamadas, atraso promedio s, atraso max s, con atraso > 2 min"
          WEEK=$(( SINCE - 7 * 86400000 ))
          q "SELECT c.executive_id, date(c.started_at/1000, 'unixepoch', '-3 hours'), COUNT(*), CAST(AVG($LAG) AS INT), MAX($LAG), SUM($LAG > 120) FROM calls c WHERE c.started_at >= $WEEK AND c.received_at - c.started_at < 86400000 GROUP BY 1, 2 ORDER BY 1, 2"
